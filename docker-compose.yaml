services:

  eterna-ingest-service:
    build:
      context: .
      dockerfile: eterna-ingest-service/Dockerfile
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8082:8080"
    volumes:
      # Montera kundspecifikt schema hit
      - ./examples/schema-arende.yaml:/config/schema.yaml:ro
      # Genererade overlay-filer — kopiera till ETERNA efter start
      - eterna-overlay:/config/overlay
    environment:
      ETERNA_URL: ${ETERNA_URL:-http://eterna:8080}
      ETERNA_USERNAME: ${ETERNA_USERNAME:-admin}
      ETERNA_PASSWORD: ${ETERNA_PASSWORD:-eterna}
      ETERNA_PARENT_ID: ${ETERNA_PARENT_ID}
      ETERNA_API_PATH: ${ETERNA_API_PATH:-/api/v1}
      INGEST_AUTO_DEPLOY_OVERLAY: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eterna-overlay:

