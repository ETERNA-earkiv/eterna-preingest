# Schema för dokumentsamling — t.ex. digitaliserade samlingar, projekt-arkiv
# Använder Dublin Core-inspirerat fältupplägg

record:
  metadataType: "samling"
  label:
    sv: "Samling"
    en: "Collection"

item:
  metadataType: "dokument"
  label:
    sv: "Dokument"
    en: "Document"

recordFields:
  - name: samlingId
    type: string
    required: true
    label: { sv: "Samlings-ID", en: "Collection ID" }

  - name: titel
    type: string
    required: true
    label: { sv: "Titel", en: "Title" }

  - name: beskrivning
    type: text
    required: false
    label: { sv: "Beskrivning", en: "Description" }

  - name: skapare
    type: string
    required: false
    label: { sv: "Skapare", en: "Creator" }

  - name: startdatum
    type: date
    required: true
    label: { sv: "Startdatum", en: "Start Date" }

  - name: slutdatum
    type: date
    required: false
    label: { sv: "Slutdatum", en: "End Date" }

  - name: sprak
    type: enumeration
    required: false
    values: ["sv", "en", "de", "fr", "no", "da"]
    label: { sv: "Språk", en: "Language" }

  - name: status
    type: enumeration
    required: true
    values: ["Aktiv", "Avslutad", "Arkiverad"]
    label: { sv: "Status", en: "Status" }

itemFields:
  - name: dokumentId
    type: string
    required: true
    label: { sv: "Dokument-ID", en: "Document ID" }

  - name: titel
    type: string
    required: true
    label: { sv: "Titel", en: "Title" }

  - name: beskrivning
    type: text
    required: false
    label: { sv: "Beskrivning", en: "Description" }

  - name: skapare
    type: string
    required: false
    label: { sv: "Skapare/Författare", en: "Creator/Author" }

  - name: datum
    type: date
    required: false
    label: { sv: "Datum", en: "Date" }

  - name: format
    type: string
    required: false
    label: { sv: "Format", en: "Format" }

  - name: nyckelord
    type: string
    required: false
    label: { sv: "Nyckelord", en: "Keywords" }
